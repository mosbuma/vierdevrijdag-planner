# Synology / NAS — adjust DATABASE_URL and NEXTAUTH_* via env file or environment block.
# Poster JPGs are written under public/generated/posters at runtime; bind-mount so they persist.
#
# `build.network: host` matches marcflix-2025 and needs a BuildKit-capable builder. If you see
# "mount option requires BuildKit", enable it for this shell (same as modern Docker Desktop):
#   export DOCKER_BUILDKIT=1
#   export COMPOSE_DOCKER_CLI_BUILD=1
#   docker compose build
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Same as marcflix-2025: host network during build so npm/registry works reliably on Synology.
      network: host
    container_name: vierdevrijdag-app
    restart: unless-stopped
    network_mode: host
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - PORT=3009 # ${PORT:-3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3009}
    volumes:
      # Persist generated meetup posters (optional but recommended on NAS).
      - ./public/generated:/app/public/generated
    # With bridge network instead of host, use:
    # ports:
    #   - "3009:3009"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
