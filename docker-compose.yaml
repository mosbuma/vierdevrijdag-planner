# Synology / NAS — adjust DATABASE_URL, NEXTAUTH_*, and NOSTR_* via .env (host) or environment block.
# Poster JPEGs are stored outside public/ (see POSTER_STORAGE_DIR) so Next.js never scandirs a
# bad bind mount under public/generated. Bind-mount the storage dir so files persist.
#
# `build.network: host` matches marcflix-2025 and needs a BuildKit-capable builder. If you see
# "mount option requires BuildKit", enable it for this shell (same as modern Docker Desktop):
#   export DOCKER_BUILDKIT=1
#   export COMPOSE_DOCKER_CLI_BUILD=1
#   docker compose build
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Same as marcflix-2025: host network during build so npm/registry works reliably on Synology.
      network: host
    container_name: vierdevrijdag-app
    restart: unless-stopped
    network_mode: host
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - PORT=3009 # ${PORT:-3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3009}
      - POSTER_STORAGE_DIR=/data/posters
      - NOSTR_NPUB=${NOSTR_NPUB}
      - NOSTR_NSEC=${NOSTR_NSEC}
      - NOSTR_CRON_TOKEN=${NOSTR_CRON_TOKEN}
    # Synology mounts are often root-owned; match marcflix-2025 if writes/reads fail for UID 1001.
    user: "0:0"
    volumes:
      - ./data/posters:/data/posters
    # With bridge network instead of host, use:
    # ports:
    #   - "3009:3009"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
